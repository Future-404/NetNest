name: Build and Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NetNest-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Find successful main build
        id: main-build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          deadline=$((SECONDS + 900))

          while (( SECONDS < deadline )); do
            run_details="$(
              gh run list \
                --workflow build.yml \
                --branch main \
                --commit "$GITHUB_SHA" \
                --event push \
                --limit 1 \
                --json databaseId,status,conclusion \
                --jq '.[] | [.databaseId, .status, (.conclusion // "")] | @tsv'
            )"

            if [ -n "$run_details" ]; then
              IFS=$'\t' read -r run_id run_status run_conclusion <<< "$run_details"

              if [ "$run_status" = "completed" ]; then
                if [ "$run_conclusion" != "success" ]; then
                  echo "::error::Main build $run_id finished with $run_conclusion"
                  exit 1
                fi

                echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi

            sleep 10
          done

          echo "::error::Timed out waiting for a successful main build of $GITHUB_SHA"
          exit 1

      - name: Download APK from main build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MAIN_RUN_ID: ${{ steps.main-build.outputs.run_id }}
        run: gh run download "$MAIN_RUN_ID" --name NetNest-Debug-APK --dir release-apk

      - name: Verify version and prepare APK
        run: |
          app_version="$(sed -n 's/^[[:space:]]*versionName = "\(.*\)"/\1/p' app/build.gradle.kts)"
          if [ "v${app_version}" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $app_version"
            exit 1
          fi
          mv release-apk/app-debug.apk "release-apk/NetNest-${GITHUB_REF_NAME}-debug.apk"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "release-apk/NetNest-${GITHUB_REF_NAME}-debug.apk"
          --verify-tag
          --generate-notes
          --title "NetNest ${GITHUB_REF_NAME} (Debug signed)"
